{% extends "base.html" %}
{% block title %}Akun Admin · Remote Server{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <h1>Akun Admin</h1>
    <p class="muted">Ubah password awal setelah instalasi pertama.</p>
  </div>
</div>
<div class="panel padded narrow-panel">
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
  <form method="post" action="/account" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username
      <input value="{{ admin.username }}" disabled>
    </label>
    <label>Password saat ini
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>Password baru
      <input type="password" name="new_password" required minlength="12" autocomplete="new-password">
    </label>
    <label>Ulangi password baru
      <input type="password" name="confirm_password" required minlength="12" autocomplete="new-password">
    </label>
    <button class="button primary" type="submit">Simpan Password</button>
  </form>
</div>
{% endblock %}
