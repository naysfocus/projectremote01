name: remote-server

x-common-environment: &common-environment
  APP_NAME: Remote Server
  ENVIRONMENT: production
  DATABASE_URL: sqlite:////data/auth.db
  LOG_LEVEL: INFO
  RUNTIME_CONFIG_FILE: /data/runtime.env
  DATA_DIR: /data
  PUBLIC_BASE_URL: http://100.113.142.11:8800
  SESSION_COOKIE_NAME: remote_server_admin_session
  SESSION_COOKIE_SECURE: "auto"
  TRUSTED_PROXY_HEADERS: "true"
  HEARTBEAT_INTERVAL_SECONDS: "300"
  SESSION_TIMEOUT_SECONDS: "900"
  GRACE_PERIOD_HOURS: "3"
  ACTIVATION_KEY_TTL_HOURS: "1"
  BACKUP_INTERVAL_HOURS: "24"
  BACKUP_RETENTION_COUNT: "14"
  MAINTENANCE_INTERVAL_MINUTES: "60"
  HEARTBEAT_RETENTION_DAYS: "30"
  REPORT_RETENTION_DAYS: "365"
  AUDIT_RETENTION_DAYS: "365"
  OUTBOX_RETENTION_DAYS: "30"
  DISPLAY_TIMEZONE: Asia/Jakarta

x-common-service: &common-service
  image: remote-server:1.7
  restart: unless-stopped
  init: true
  environment: *common-environment
  volumes:
    - remote_data:/data
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *common-service
    build:
      context: .
    container_name: remote-server
    environment:
      <<: *common-environment
      INITIAL_CREDENTIALS_FILE: /data/INITIAL_ADMIN_CREDENTIALS.txt
      FIRST_START_MARKER_FILE: /data/.first_start_pending
      SERVER_PUBLIC_PORT: "8800"
    ports:
      - "100.113.142.11:8800:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 20s

  scheduler:
    <<: *common-service
    container_name: remote-scheduler
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,pathlib,datetime; p=pathlib.Path('/data/scheduler-status.json'); d=json.loads(p.read_text()); t=datetime.datetime.fromisoformat(d['updated_at']); assert (datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<7200"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s

  integrations:
    <<: *common-service
    container_name: remote-integrations
    command: ["python", "-m", "app.integrations"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,pathlib,datetime; p=pathlib.Path('/data/integration-status.json'); d=json.loads(p.read_text()); t=datetime.datetime.fromisoformat(d['updated_at']); assert (datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  remote_data:
    # Legacy volume name is intentionally preserved so upgrades keep all data.
    name: scaleup_server_data
